# HaramYar full local stack on Hive Platform 0.1.0-dev.0. Generate secrets first: node deployment/generate-env.mjs
# Build images: npm run images (see docs/DEPLOYMENT.md). Then: docker compose -f deployment/docker-compose.yml up -d
# Local topology: plain HTTP on http://localhost:8080 (HARAMYAR_PROFILE/HIVE_PROFILE=development). Production: HTTPS
# in front of the gateway and the production profiles (docs/DEPLOYMENT.md).
name: haramyar
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
x-java-service: &java
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  networks: [internal]

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node deployment/generate-env.mjs}
      HIVE_DB_PASSWORD: ${HIVE_DB_PASSWORD:?required}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:?required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      ROZEH_DB_PASSWORD: ${ROZEH_DB_PASSWORD:?required}
      MARTYRS_DB_PASSWORD: ${MARTYRS_DB_PASSWORD:?required}
      SHELL_DB_PASSWORD: ${SHELL_DB_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck: {test: [CMD-SHELL, pg_isready -U postgres], interval: 3s, timeout: 3s, retries: 40}
    logging: *logging
    networks: [internal]

  openfga-migrate:
    image: openfga/openfga:v1.18.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on: {postgres: {condition: service_healthy}}
    networks: [internal]
  openfga:
    image: openfga/openfga:v1.18.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on: {openfga-migrate: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, /usr/local/bin/grpc_health_probe, -addr=127.0.0.1:8081], interval: 3s, timeout: 3s, retries: 40}
    logging: *logging
    networks: [internal]

  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?required}", --save, ""]
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD}"}
    healthcheck: {test: [CMD-SHELL, "redis-cli ping | grep PONG"], interval: 3s, timeout: 3s, retries: 40}
    logging: *logging
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    entrypoint: ["/bin/sh", "/opt/haramyar/entrypoint.sh"]
    environment:
      HARAMYAR_RABBITMQ_USER: haramyar
      HARAMYAR_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/entrypoint.sh:/opt/haramyar/entrypoint.sh:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-haramyar.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck: {test: [CMD-SHELL, "test -f /tmp/haramyar-user-ready && rabbitmq-diagnostics -q check_port_connectivity"], interval: 5s, timeout: 10s, retries: 30}
    logging: *logging
    networks: [internal]

  object-storage:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "/opt/haramyar/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
    volumes:
      - objects:/data
      - ./seaweedfs/entrypoint.sh:/opt/haramyar/entrypoint.sh:ro
    healthcheck: {test: [CMD-SHELL, "wget -qS -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 403"], interval: 5s, timeout: 3s, retries: 40}
    logging: *logging
    networks: [internal]

  books-storage:
    # Dedicated private MinIO volume; never mount or reinterpret the existing SeaweedFS objects volume.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${BOOKS_S3_ACCESS_KEY:-${S3_ACCESS_KEY:?required}}
      MINIO_ROOT_PASSWORD: ${BOOKS_S3_SECRET_KEY:-${S3_SECRET_KEY:?required}}
    volumes: [books_objects:/data]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"], interval: 5s, timeout: 5s, retries: 40}
    logging: *logging
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports: ["127.0.0.1:8025:8025"]
    logging: *logging
    networks: [internal]

  keycloak:
    image: haramyar/keycloak:${HARAMYAR_VERSION:-0.1.0}
    build: {context: ../integrations/keycloak}
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-haramyar-bootstrap}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      HARAMYAR_PUBLIC_ORIGIN: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}
      HARAMYAR_OIDC_CLIENT_SECRET: ${HARAMYAR_OIDC_CLIENT_SECRET:?required}
      HARAMYAR_SMTP_HOST: ${HARAMYAR_SMTP_HOST:-mailpit}
      HARAMYAR_SMTP_PORT: ${HARAMYAR_SMTP_PORT:-1025}
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"], interval: 5s, timeout: 5s, retries: 60}
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  authorization:
    <<: *java
    image: hive/authorization:${HIVE_VERSION:-0.1.0-dev}
    environment:
      HIVE_PROFILE: ${HIVE_PROFILE:-development}
      HIVE_DB_URL: jdbc:postgresql://postgres:5432/hive
      HIVE_DB_USER: hive
      HIVE_DB_PASSWORD: ${HIVE_DB_PASSWORD}
      HIVE_OPENFGA_URL: http://openfga:8080
      HIVE_INTERNAL_PASSWORD: ${HIVE_INTERNAL_PASSWORD:?required}
      HIVE_PROVISIONING_PASSWORD: ${HIVE_PROVISIONING_PASSWORD:?required}
      HIVE_AUTHZ_CACHE_ENABLED: "true"
      HIVE_REDIS_HOST: redis
      HIVE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      HIVE_PRIMARY_ISSUER: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}/realms/haramyar
      HIVE_IDP_ALLOW_LOCAL_HTTP: ${HIVE_ALLOW_LOCAL_HTTP:-true}
      HIVE_BOOTSTRAP_ADMIN_SUBJECT: ${HIVE_BOOTSTRAP_ADMIN_SUBJECT:-}
      # Micro-frontends are served by their own module services on the internal network.
      HIVE_ARTIFACT_NETWORK_POLICY: INTERNAL_ENTERPRISE
      HIVE_ARTIFACT_ALLOW_HTTP: "true"
      HIVE_ARTIFACT_ALLOWED_PRIVATE_CIDRS: ${HARAMYAR_INTERNAL_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      HIVE_TARGET_NETWORK_POLICY: INTERNAL_ENTERPRISE
      HIVE_TARGET_ALLOW_HTTP: "true"
      HIVE_TARGET_ALLOWED_PRIVATE_CIDRS: ${HARAMYAR_INTERNAL_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      HIVE_ENVIRONMENT: ${HIVE_ENVIRONMENT:-local}
    depends_on:
      postgres: {condition: service_healthy}
      openfga: {condition: service_healthy}
      redis: {condition: service_healthy}

  gateway:
    image: haramyar/gateway:${HARAMYAR_VERSION:-0.1.0}
    build: {context: ../apps/haramyar-shell}
    ports: ["127.0.0.1:${HARAMYAR_HTTP_PORT:-8080}:8080"]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  # The BFF shares the gateway's network namespace so the OIDC issuer (http://localhost:8080/realms/haramyar) is the
  # same URL for browsers and for the BFF in local HTTP development. Production uses an HTTPS issuer instead.
  bff:
    image: hive/bff:${HIVE_VERSION:-0.1.0-dev}
    network_mode: "service:gateway"
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    environment:
      HIVE_PROFILE: ${HIVE_PROFILE:-development}
      HIVE_AUTHORIZATION_URL: http://authorization:8082
      HIVE_CONTROL_ALLOW_HTTP: "true"
      HIVE_INTERNAL_PASSWORD: ${HIVE_INTERNAL_PASSWORD}
      HIVE_REDIS_HOST: redis
      HIVE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      HIVE_VAULT_KEY: ${HIVE_VAULT_KEY:?required}
      HIVE_IDENTITY_ENABLED: "true"
      HIVE_OIDC_ISSUER: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}/realms/haramyar
      HIVE_OIDC_CLIENT_ID: haramyar-web
      HIVE_OIDC_CLIENT_SECRET: ${HARAMYAR_OIDC_CLIENT_SECRET}
      HIVE_OIDC_ALLOW_LOCAL_HTTP: ${HIVE_ALLOW_LOCAL_HTTP:-true}
      HIVE_PROXY_ALLOWED_ORIGINS: http://rozeh-booking:8090,http://martyrs:8091,http://shell-service:8092
      HIVE_PROXY_NETWORK_POLICY: INTERNAL_ENTERPRISE
      HIVE_PROXY_ALLOW_HTTP: "true"
      HIVE_PROXY_ALLOWED_PRIVATE_CIDRS: ${HARAMYAR_INTERNAL_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      HIVE_MFE_NETWORK_POLICY: INTERNAL_ENTERPRISE
      HIVE_MFE_ALLOW_HTTP: "true"
      HIVE_MFE_ALLOWED_PRIVATE_CIDRS: ${HARAMYAR_INTERNAL_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      HIVE_BRANDING_NAME: حرم‌یار
      HIVE_LOCALE: fa
      HIVE_DIRECTION: rtl
    depends_on:
      authorization: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      gateway: {condition: service_started}

  rozeh-booking:
    <<: *java
    image: haramyar/rozeh-booking:${ROZEH_BOOKING_VERSION:-1.0.1}
    build: {context: ../modules/rozeh-booking}
    environment: &business-env
      HARAMYAR_PROFILE: ${HARAMYAR_PROFILE:-development}
      HARAMYAR_OIDC_ISSUER: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}/realms/haramyar
      HARAMYAR_OIDC_JWKS_URI: http://keycloak:8080/realms/haramyar/protocol/openid-connect/certs
      ROZEH_DB_URL: jdbc:postgresql://postgres:5432/rozeh
      ROZEH_DB_USER: rozeh
      ROZEH_DB_PASSWORD: ${ROZEH_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  martyrs:
    <<: *java
    image: haramyar/martyrs:${MARTYRS_VERSION:-1.0.1}
    build: {context: ../modules/martyrs}
    environment:
      HARAMYAR_PROFILE: ${HARAMYAR_PROFILE:-development}
      HARAMYAR_OIDC_ISSUER: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}/realms/haramyar
      HARAMYAR_OIDC_JWKS_URI: http://keycloak:8080/realms/haramyar/protocol/openid-connect/certs
      MARTYRS_DB_URL: jdbc:postgresql://postgres:5432/martyrs
      MARTYRS_DB_USER: martyrs
      MARTYRS_DB_PASSWORD: ${MARTYRS_DB_PASSWORD}
      MARTYRS_S3_ENDPOINT: http://object-storage:8333
      MARTYRS_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      MARTYRS_S3_SECRET_KEY: ${S3_SECRET_KEY}
      BOOKS_S3_ENDPOINT: http://books-storage:9000
      BOOKS_S3_ACCESS_KEY: ${BOOKS_S3_ACCESS_KEY:-${S3_ACCESS_KEY:?required}}
      BOOKS_S3_SECRET_KEY: ${BOOKS_S3_SECRET_KEY:-${S3_SECRET_KEY:?required}}
    depends_on:
      postgres: {condition: service_healthy}
      object-storage: {condition: service_healthy}
      books-storage: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  shell-service:
    <<: *java
    image: haramyar/shell-service:${SHELL_SERVICE_VERSION:-1.0.0}
    build: {context: ../apps/shell-service}
    environment:
      HARAMYAR_PROFILE: ${HARAMYAR_PROFILE:-development}
      HARAMYAR_OIDC_ISSUER: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}/realms/haramyar
      HARAMYAR_OIDC_JWKS_URI: http://keycloak:8080/realms/haramyar/protocol/openid-connect/certs
      SHELL_DB_URL: jdbc:postgresql://postgres:5432/shell
      SHELL_DB_USER: shell
      SHELL_DB_PASSWORD: ${SHELL_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      HIVE_AUTHORIZATION_URL: http://authorization:8082
      HIVE_PROVISIONING_PASSWORD: ${HIVE_PROVISIONING_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  public-web:
    image: haramyar/public-web:${HARAMYAR_VERSION:-0.1.0}
    build: {context: ../apps/public-web}
    environment:
      HARAMYAR_BFF_URL: http://gateway:8080
      HARAMYAR_PUBLIC_ORIGIN: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  # One-shot: registers HaramYar in Hive (application, modules, manifests, routes, roles, grants) and, in the dev
  # profile, provisions staff fixtures. Idempotent; rerun after deploying a new module version.
  bootstrap:
    image: haramyar/bootstrap:${HARAMYAR_VERSION:-0.1.0}
    build: {context: ../integrations}
    profiles: [bootstrap]
    environment:
      HIVE_AUTHORIZATION_URL: http://authorization:8082
      HIVE_PROVISIONING_PASSWORD: ${HIVE_PROVISIONING_PASSWORD}
      ROZEH_BOOKING_URL: http://rozeh-booking:8090
      MARTYRS_URL: http://martyrs:8091
      SHELL_SERVICE_URL: http://shell-service:8092
      HARAMYAR_DEV_FIXTURES: ${HARAMYAR_DEV_FIXTURES:-false}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-haramyar-bootstrap}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      HARAMYAR_OIDC_ISSUER: ${HARAMYAR_PUBLIC_ORIGIN:-http://localhost:8080}/realms/haramyar
      HARAMYAR_FIXTURE_STAFF_PASSWORD: ${HARAMYAR_FIXTURE_STAFF_PASSWORD:-}
      HARAMYAR_FIXTURE_CUSTOMERS: ${HARAMYAR_FIXTURE_CUSTOMERS:-}
      # Local development keeps self-registration on (the E2E suite registers new accounts); test/production default off.
      HARAMYAR_SELF_REGISTRATION: ${HARAMYAR_SELF_REGISTRATION:-true}
      HARAMYAR_PASSWORD_RESET: ${HARAMYAR_PASSWORD_RESET:-false}
    depends_on:
      authorization: {condition: service_healthy}
      rozeh-booking: {condition: service_healthy}
      martyrs: {condition: service_healthy}
      shell-service: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres:
  rabbitmq:
  objects:
  books_objects:
