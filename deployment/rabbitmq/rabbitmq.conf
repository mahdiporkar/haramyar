# Topology (exchanges, consumer queues, retry stages, DLQ) is loaded at boot so no event is published before its
# consumer queue exists. Users are created from the environment (RABBITMQ_DEFAULT_USER/PASS).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true
loopback_users.guest = true
