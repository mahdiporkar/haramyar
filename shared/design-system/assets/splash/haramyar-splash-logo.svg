  <title id="title1">حرم‌یار | HARAMYAR — Luxury Brand Logo</title>
  <desc id="desc1">Vector reconstruction of the approved Haramyar emerald-and-gold arch, golden dome and journey ribbons logo, with Persian and English lettering. Transparent background.</desc>
