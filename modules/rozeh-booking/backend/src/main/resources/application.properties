spring.application.name=rozeh-booking
server.port=${PORT:8090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

# PostgreSQL (schema owned by this service only)
spring.datasource.url=${ROZEH_DB_URL:jdbc:postgresql://localhost:5432/rozeh}
spring.datasource.username=${ROZEH_DB_USER:rozeh}
spring.datasource.password=${ROZEH_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/kit,classpath:db/migration

# RabbitMQ (outbox publication with broker confirms)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:haramyar}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=simple

# Trust boundary: tokens forwarded by the Hive BFF (FORWARD_TOKEN) plus X-Hive-User-Id
haramyar.security.issuer=${HARAMYAR_OIDC_ISSUER:}
haramyar.security.jwk-set-uri=${HARAMYAR_OIDC_JWKS_URI:}
haramyar.security.client-id=${HARAMYAR_OIDC_CLIENT_ID:haramyar-web}
haramyar.security.staff-role=${HARAMYAR_STAFF_ROLE:haramyar-staff}
haramyar.profile=${HARAMYAR_PROFILE:production}

# Provisional business policies (docs/BUSINESS_DECISIONS.md)
haramyar.rozeh.categories=${ROZEH_CATEGORIES:rozeh}
haramyar.rozeh.audiences=${ROZEH_AUDIENCES:family,women,men}
haramyar.rozeh.delivery-modes=${ROZEH_DELIVERY_MODES:in-person}
haramyar.rozeh.confirmation-by=${ROZEH_CONFIRMATION_BY:HOST}
haramyar.rozeh.provider-required-for-confirmation=${ROZEH_PROVIDER_REQUIRED:false}
haramyar.rozeh.host-cancellation-notice=${ROZEH_HOST_CANCELLATION_NOTICE:}
haramyar.rozeh.require-verified-mobile=${ROZEH_REQUIRE_VERIFIED_MOBILE:false}

# Health: liveness/readiness probes; details never exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

# Micro-frontend artifact of this module, fetched server-side by the Hive artifact gateway
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
