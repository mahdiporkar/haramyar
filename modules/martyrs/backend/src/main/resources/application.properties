spring.application.name=martyrs
server.port=${PORT:8091}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

spring.datasource.url=${MARTYRS_DB_URL:jdbc:postgresql://localhost:5432/martyrs}
spring.datasource.username=${MARTYRS_DB_USER:martyrs}
spring.datasource.password=${MARTYRS_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/kit,classpath:db/migration

# Uploads arrive through the Hive BFF. Image domain limit remains 5 MiB;
# complete book PDFs have a separate 30 MiB domain limit.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB

haramyar.security.issuer=${HARAMYAR_OIDC_ISSUER:}
haramyar.security.jwk-set-uri=${HARAMYAR_OIDC_JWKS_URI:}
haramyar.security.client-id=${HARAMYAR_OIDC_CLIENT_ID:haramyar-web}
haramyar.security.staff-role=${HARAMYAR_STAFF_ROLE:haramyar-staff}
haramyar.profile=${HARAMYAR_PROFILE:production}

# Proposed editorial policy (docs/BUSINESS_DECISIONS.md)
haramyar.martyrs.four-eyes=${MARTYRS_FOUR_EYES:true}

# Private S3-compatible bucket (MinIO); credentials only from the environment
haramyar.martyrs.storage.endpoint=${MARTYRS_S3_ENDPOINT:http://localhost:9000}
haramyar.martyrs.storage.region=${MARTYRS_S3_REGION:us-east-1}
haramyar.martyrs.storage.access-key=${MARTYRS_S3_ACCESS_KEY:}
haramyar.martyrs.storage.secret-key=${MARTYRS_S3_SECRET_KEY:}
haramyar.martyrs.storage.bucket=${MARTYRS_S3_BUCKET:haramyar-martyrs}
haramyar.martyrs.books.endpoint=${BOOKS_S3_ENDPOINT:http://localhost:9000}
haramyar.martyrs.books.region=${BOOKS_S3_REGION:us-east-1}
haramyar.martyrs.books.access-key=${BOOKS_S3_ACCESS_KEY:}
haramyar.martyrs.books.secret-key=${BOOKS_S3_SECRET_KEY:}
haramyar.martyrs.books.bucket=${BOOKS_S3_BUCKET:haramyar-books}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
