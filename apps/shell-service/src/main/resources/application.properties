spring.application.name=shell-service
server.port=${PORT:8092}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

spring.datasource.url=${SHELL_DB_URL:jdbc:postgresql://localhost:5432/shell}
spring.datasource.username=${SHELL_DB_USER:shell}
spring.datasource.password=${SHELL_DB_PASSWORD:}
spring.flyway.locations=classpath:db/kit,classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:haramyar}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=simple
# This service only consumes integration events; it publishes nothing.
haramyar.messaging.publisher.enabled=false

haramyar.security.issuer=${HARAMYAR_OIDC_ISSUER:}
haramyar.security.jwk-set-uri=${HARAMYAR_OIDC_JWKS_URI:}
haramyar.security.client-id=${HARAMYAR_OIDC_CLIENT_ID:haramyar-web}
haramyar.security.staff-role=${HARAMYAR_STAFF_ROLE:haramyar-staff}
haramyar.profile=${HARAMYAR_PROFILE:production}

# Hive control plane (onboarding only). The provisioning credential comes from the environment.
haramyar.hive.authorization-url=${HIVE_AUTHORIZATION_URL:http://localhost:8082}
haramyar.hive.provisioning-password=${HIVE_PROVISIONING_PASSWORD:}
haramyar.hive.default-role=${HARAMYAR_DEFAULT_ROLE:haramyar-user}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
